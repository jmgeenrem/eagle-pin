<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eagle PIN · Repair Hub</title>

<style>

:root {
  --bg: #090d12;
  --panel: #11171e;
  --panel-2: #0e141b;
  --border: rgba(255,255,255,.08);
  --text: #f2f5f7;
  --muted: #8e98a5;
  --green: #2ee58c;
  --amber: #d6a64b;
  --red: #ff5f65;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.wrap {
  max-width: 1010px;
  margin: 0 auto;
  padding: 28px 0 60px;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.brand {
  display: flex;
  align-items: center;
  gap: 14px;
}

.logo {
  width: 58px;
  height: 58px;
  border-radius: 14px;
  object-fit: cover;
  display: block;
  box-shadow:
    0 0 0 1px rgba(216, 170, 91, .22),
    0 6px 18px rgba(0, 0, 0, .35),
    0 0 18px rgba(216, 170, 91, .10);
}

h1 {
  margin: 0;
  font-size: 30px;
  letter-spacing: -.8px;
}

.subtitle {
  color: var(--muted);
  margin-top: 4px;
  font-size: 14px;
}

.status {
  text-align: right;
  font-size: 13px;
  color: var(--muted);
}

.live {
  color: var(--green);
  font-weight: 700;
  margin-bottom: 5px;
}

.eagle-nav {
  display: flex;
  gap: 28px;
  margin: 26px 0 22px;
  border-bottom: 1px solid var(--border);
}

.nav-link {
  position: relative;
  padding-bottom: 12px;
  color: var(--muted);
  text-decoration: none;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
}

.nav-link.active {
  color: var(--text);
}

.nav-link.active::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: -1px;
  height: 2px;
  background: #c9aa6a;
  border-radius: 2px;
}

.section-label {
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.4px;
  margin-bottom: 10px;
}

.grid {
  display: grid;
  grid-template-columns: 1.05fr .95fr;
  gap: 18px;
}

.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
}

.field {
  margin-bottom: 16px;
}

label {
  display: block;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 7px;
}

select,
input {
  width: 100%;
  background: var(--panel-2);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 13px;
  font-size: 14px;
  outline: none;
}

.value-strip {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 10px;
}

.value-box {
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
}

.value-box small {
  display: block;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: .7px;
  margin-bottom: 4px;
}

.value-box strong {
  font-size: 18px;
}

.repair-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 11px 0;
  border-bottom: 1px solid var(--border);
}

.repair-row:last-child {
  border-bottom: 0;
}

.repair-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.repair-row input {
  width: auto;
}

.max-buy-card {
  margin-top: 18px;
  background: linear-gradient(180deg, rgba(46,229,140,.06), rgba(46,229,140,.02));
  border: 1px solid rgba(46,229,140,.18);
  border-radius: 16px;
  padding: 22px;
}

.max-buy-label {
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.2px;
}

.max-buy {
  font-size: 48px;
  font-weight: 800;
  margin: 4px 0 8px;
  letter-spacing: -1.5px;
}

.deal-status {
  display: inline-flex;
  padding: 6px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .8px;
  color: var(--green);
  border: 1px solid rgba(46,229,140,.22);
  background: rgba(46,229,140,.08);
}

.summary-strip {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0;
  margin-top: 22px;
  border-top: 1px solid rgba(255,255,255,.08);
  padding-top: 18px;
}

.summary-item {
  padding: 0 18px;
  border-right: 1px solid rgba(255,255,255,.08);
}

.summary-item:first-child {
  padding-left: 0;
}

.summary-item:last-child {
  border-right: 0;
}

.summary-item span {
  display: block;
  color: var(--muted);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  margin-bottom: 6px;
}

.summary-item strong {
  font-size: 16px;
  color: var(--text);
}

input[type="number"] {
  color-scheme: dark;
}

.breakdown {
  margin-top: 18px;
}

.breakdown-row {
  display: flex;
  justify-content: space-between;
  padding: 9px 0;
  color: var(--muted);
  font-size: 13px;
}

.breakdown-row strong {
  color: var(--text);
}

@media (max-width: 760px) {
  .wrap {
    padding: 18px 14px 32px;
  }

  .topbar {
    flex-direction: column;
    align-items: flex-start;
    gap: 14px;
  }

  .status {
    text-align: left;
  }

  .grid {
    grid-template-columns: 1fr;
  }
}

.pin-confidence {
  display: block;
  margin-top: 5px;
  color: var(--muted);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
}



.parts-head {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 20px;
  margin-bottom: 22px;
}

.parts-head .field {
  width: 320px;
  margin: 0;
}

.parts-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}

.part-card {
  position: relative;
  min-height: 245px;
  padding: 20px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background:
    linear-gradient(180deg, rgba(255,255,255,.018), transparent 60%),
    var(--panel);
  display: flex;
  flex-direction: column;
  transition:
    transform .18s ease,
    border-color .18s ease,
    background .18s ease;
}

.part-card:hover {
  transform: translateY(-2px);
  border-color: rgba(127,179,255,.25);
  background:
    linear-gradient(180deg, rgba(127,179,255,.035), transparent 65%),
    var(--panel);
}

.part-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
}

.part-icon {
  width: 42px;
  height: 42px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  color: #d9c391;
  background: rgba(177,142,76,.07);
  border: 1px solid rgba(202,164,88,.22);
  box-shadow:
    inset 0 1px 0 rgba(255,225,165,.035),
    0 0 20px rgba(177,142,76,.045);
}

.part-icon svg {
  width: 21px;
  height: 21px;
  stroke: currentColor;
}

.preferred {
  padding: 5px 8px;
  border-radius: 999px;
  color: var(--green);
  background: rgba(53,208,127,.07);
  border: 1px solid rgba(53,208,127,.18);
  font-size: 8px;
  font-weight: 800;
  letter-spacing: .1em;
}

.part-category {
  margin-top: 18px;
  color: var(--muted);
  font-size: 9px;
  font-weight: 800;
  letter-spacing: .13em;
}

.part-name {
  margin-top: 6px;
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
}

.part-price {
  margin-top: 14px;
  font-size: 25px;
  font-weight: 760;
  letter-spacing: -.02em;
  color: var(--text);
}

.part-meta {
  margin-top: 7px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.55;
}

.part-footer {
  margin-top: auto;
  padding-top: 18px;
}

.part-link,
.part-link-disabled {
  width: 100%;
  min-height: 36px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .08em;
}

.part-link {
  color: #d9c391;
  background:
    linear-gradient(180deg, rgba(177,142,76,.10), rgba(177,142,76,.035)),
    #111318;
  border: 1px solid rgba(202,164,88,.30);
  box-shadow:
    inset 0 1px 0 rgba(255,225,165,.04),
    0 2px 7px rgba(0,0,0,.18);
  transition:
    color .18s ease,
    background .18s ease,
    border-color .18s ease,
    box-shadow .18s ease,
    transform .18s ease;
}

.part-link:hover {
  color: #ead7a6;
  background:
    linear-gradient(180deg, rgba(177,142,76,.17), rgba(177,142,76,.06)),
    #121419;
  border-color: rgba(202,164,88,.58);
  box-shadow:
    inset 0 1px 0 rgba(255,225,165,.07),
    0 3px 12px rgba(0,0,0,.22),
    0 0 12px rgba(177,142,76,.06);
  transform: translateY(-1px);
}

.part-link-disabled {
  color: #65707c;
  background: rgba(255,255,255,.025);
  border: 1px solid rgba(255,255,255,.06);
  cursor: default;
}

.empty-state {
  grid-column: 1 / -1;
  padding: 55px 25px;
  text-align: center;
  border: 1px dashed var(--line);
  border-radius: 14px;
  color: var(--muted);
  background: var(--panel);
}

.empty-state strong {
  display: block;
  margin-bottom: 8px;
  color: var(--text);
  font-size: 15px;
}

.parts-count {
  color: var(--muted);
  font-size: 11px;
}

@media (max-width: 900px) {
  .parts-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 620px) {
  .parts-head {
    align-items: stretch;
    flex-direction: column;
  }

  .parts-head .field {
    width: 100%;
  }

  .parts-grid {
    grid-template-columns: 1fr;
  }
}


/* Eagle visual scale sync */
body {
  font-size: 15px;
}

.section-label {
  font-size: 11px;
}

label {
  font-size: 12px;
}

select,
input {
  font-size: 15px;
}

.nav-link {
  font-size: 11px;
}

</style>
</head>

<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <img class="logo" src="eagle-pin-icon.jpg" alt="Eagle PIN">
      <div>
        <h1>EAGLE PIN</h1>
        <div class="subtitle">iPhone Resale Market Intelligence</div>
      </div>
    </div>

    <div class="status">
      <div class="live">● LIVE</div>
      <div>Repair knowledge database</div>
    </div>
  </div>

  <nav class="eagle-nav">
    <a class="nav-link" href="./?v=v20260915-1">MARKET</a>
    <a class="nav-link" href="deal-calculator.html?v=v20260915-1">DEAL CALCULATOR</a>
    <a class="nav-link" href="parts-hub.html?v=v20260915-1">PARTS HUB</a>
    <a class="nav-link active" href="repair-hub.html?v=v20260916-1">REPAIR HUB</a>
    <a class="nav-link" href="finance.html?v=v20260916-1">FINANCE</a>
    <a class="nav-link" href="alerts.html?v=v20260917-1">ALERTS</a>
    <a class="nav-link" href="http://127.0.0.1:8765/">CHAT</a>
  </nav>

  <div class="section-label">REPAIR KNOWLEDGE</div>

  <div class="parts-head">
    <div class="field">
      <label>Model</label>
      <select id="modelSelect"></select>
    </div>

    <div class="field">
      <label>Repair</label>
      <select id="repairSelect"></select>
    </div>
  </div>

  <div class="grid">

    <div class="card">
      <div class="section-label">VIDEO GUIDE</div>

      <div id="videoArea"></div>
    </div>

    <div class="card">
      <div class="section-label">STEP-BY-STEP GUIDES</div>
      <div id="guidesArea"></div>
    </div>

  </div>

<script>
const REPAIR_DATA = {
  "iPhone 14 Pro Max": {
    "Screen Replacement": {
      videos: [
        {
          title: "Self-Diagnostic Screen / Repair Assistant",
          youtube: "Cx7MAtB1z38",
          start: 0,
          end: 137,
          relevant: "0:00–2:17"
        }
      ],
      guides: [
        {
          title: "iFixit Display Replacement",
          type: "iFixit",
          url: "https://nl.ifixit.com/Guide/iPhone+14+Pro+Max+Vervanging+van+het+scherm/153003"
        }
      ]
    },

    "Battery Replacement": {
      videos: [
        {
          title: "DEJI Self-Diagnostic Battery",
          youtube: "kYXd4pELxsQ"
        }
      ],
      guides: [
        {
          title: "iFixit Battery Replacement",
          type: "iFixit",
          url: "https://nl.ifixit.com/Guide/iPhone+14+Pro+Max+Vervanging+van+de+batterij/153006"
        },
        {
          title: "Battery Adhesive / Tesa",
          type: "iFixit",
          url: "https://nl.ifixit.com/Guide/Hoe+een+voorgesneden+zelfklevend+vel+te+gebruiken-/113604"
        }
      ]
    },

    "Housing Replacement": {
      videos: [
        {
          title: "Housing Replacement",
          youtube: "Zow3XlIbNcU"
        }
      ],
      guides: []
    },

    "On-Tag Flex": {
      videos: [
        {
          title: "JCID On-Tag Flex",
          youtube: "cHYxcU17H3Y"
        }
      ],
      guides: []
    }
  },

  "iPhone 15 Pro": {},
  "iPhone 14 Pro": {},
  "iPhone 13 Pro Max": {}
};

const modelSelect = document.getElementById("modelSelect");
const repairSelect = document.getElementById("repairSelect");
const videoArea = document.getElementById("videoArea");
const guidesArea = document.getElementById("guidesArea");

Object.keys(REPAIR_DATA).forEach(model => {
  const option = document.createElement("option");
  option.value = model;
  option.textContent = model;
  modelSelect.appendChild(option);
});

modelSelect.value = "iPhone 14 Pro Max";

function loadRepairs() {
  const repairs = REPAIR_DATA[modelSelect.value] || {};
  repairSelect.innerHTML = "";

  Object.keys(repairs).forEach(repair => {
    const option = document.createElement("option");
    option.value = repair;
    option.textContent = repair;
    repairSelect.appendChild(option);
  });

  renderRepair();
}

function renderRepair() {
  const repair =
    REPAIR_DATA[modelSelect.value]?.[repairSelect.value];

  if (!repair) {
    videoArea.innerHTML = `
      <div class="empty-state">
        <strong>No tutorial data yet</strong>
        Tutorials voor dit model zijn nog niet toegevoegd.
      </div>
    `;
    guidesArea.innerHTML = "";
    return;
  }

  const videos = repair.videos || [];
  const guides = repair.guides || [];

  if (videos.length) {
    videoArea.innerHTML = videos.map(video => `
      <div style="margin-bottom:16px;">
        <div style="
          aspect-ratio:16/9;
          overflow:hidden;
          border-radius:12px;
          border:1px solid var(--border);
          background:#000;
        ">
          <iframe
            src="https://www.youtube.com/embed/${video.youtube}?start=${video.start || 0}${video.end ? `&end=${video.end}` : ""}"
            title="${video.title}"
            style="width:100%;height:100%;border:0;"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
          </iframe>
        </div>

        <div style="
          margin-top:10px;
          font-size:13px;
          font-weight:700;
          color:var(--text);
        ">
          ${video.title}
        </div>

        ${video.relevant ? `
          <div style="
            margin-top:5px;
            color:#d9c391;
            font-size:9px;
            font-weight:800;
            letter-spacing:.10em;
          ">
            RELEVANT SECTION · ${video.relevant}
          </div>
        ` : ""}
      </div>
    `).join("");
  } else {
    videoArea.innerHTML = `
      <div class="empty-state">
        <strong>No video guide yet</strong>
        Video tutorial nog niet toegevoegd.
      </div>
    `;
  }

  if (guides.length) {
    guidesArea.innerHTML = guides.map(guide => `
      <div class="repair-row">
        <div>
          <strong>${guide.title}</strong>
          <div class="part-meta">
            ${guide.type} · Photos + detailed repair steps
          </div>
        </div>

        <a
          class="part-link"
          style="width:120px;"
          href="${guide.url}"
          target="_blank"
          rel="noopener">
          OPEN GUIDE ↗
        </a>
      </div>
    `).join("");
  } else {
    guidesArea.innerHTML = `
      <div class="part-meta" style="padding:12px 0;">
        Geen step-by-step guide toegevoegd.
      </div>
    `;
  }
}

modelSelect.addEventListener("change", loadRepairs);
repairSelect.addEventListener("change", renderRepair);

loadRepairs();
</script>

</body>
</html>
