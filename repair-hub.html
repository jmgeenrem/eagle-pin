<style>

:root {
  --bg: #090d12;
  --panel: #11171e;
  --panel-2: #0e141b;
  --border: rgba(255,255,255,.08);
  --text: #f2f5f7;
  --muted: #8e98a5;
  --green: #2ee58c;
  --amber: #d6a64b;
  --red: #ff5f65;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.wrap {
  max-width: 1010px;
  margin: 0 auto;
  padding: 28px 0 60px;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.brand {
  display: flex;
  align-items: center;
  gap: 14px;
}

.logo {
  width: 58px;
  height: 58px;
  border-radius: 14px;
  object-fit: cover;
  display: block;
  box-shadow:
    0 0 0 1px rgba(216, 170, 91, .22),
    0 6px 18px rgba(0, 0, 0, .35),
    0 0 18px rgba(216, 170, 91, .10);
}

h1 {
  margin: 0;
  font-size: 30px;
  letter-spacing: -.8px;
}

.subtitle {
  color: var(--muted);
  margin-top: 4px;
  font-size: 14px;
}

.status {
  text-align: right;
  font-size: 13px;
  color: var(--muted);
}

.live {
  color: var(--green);
  font-weight: 700;
  margin-bottom: 5px;
}

.eagle-nav {
  display: flex;
  gap: 28px;
  margin: 26px 0 22px;
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  overflow-y: hidden;
  white-space: nowrap;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}

.eagle-nav::-webkit-scrollbar {
  display: none;
}

.nav-link {
  flex: 0 0 auto;
  position: relative;
  padding-bottom: 12px;
  color: var(--muted);
  text-decoration: none;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
}

.nav-link.active {
  color: var(--text);
}

.nav-link.active::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: -1px;
  height: 2px;
  background: #c9aa6a;
  border-radius: 2px;
}

.section-label {
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.4px;
  margin-bottom: 10px;
}

.grid {
  display: grid;
  grid-template-columns: 1.05fr .95fr;
  gap: 18px;
}

.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
}

.field {
  margin-bottom: 16px;
}

label {
  display: block;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 7px;
}

select,
input {
  width: 100%;
  background: var(--panel-2);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 13px;
  font-size: 14px;
  outline: none;
}

.value-strip {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 10px;
}

.value-box {
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
}

.value-box small {
  display: block;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: .7px;
  margin-bottom: 4px;
}

.value-box strong {
  font-size: 18px;
}

.repair-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 11px 0;
  border-bottom: 1px solid var(--border);
}

.repair-row:last-child {
  border-bottom: 0;
}

.repair-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.repair-row input {
  width: auto;
}

.max-buy-card {
  margin-top: 18px;
  background: linear-gradient(180deg, rgba(46,229,140,.06), rgba(46,229,140,.02));
  border: 1px solid rgba(46,229,140,.18);
  border-radius: 16px;
  padding: 22px;
}

.max-buy-label {
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.2px;
}

.max-buy {
  font-size: 48px;
  font-weight: 800;
  margin: 4px 0 8px;
  letter-spacing: -1.5px;
}

.deal-status {
  display: inline-flex;
  padding: 6px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .8px;
  color: var(--green);
  border: 1px solid rgba(46,229,140,.22);
  background: rgba(46,229,140,.08);
}

.summary-strip {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0;
  margin-top: 22px;
  border-top: 1px solid rgba(255,255,255,.08);
  padding-top: 18px;
}

.summary-item {
  padding: 0 18px;
  border-right: 1px solid rgba(255,255,255,.08);
}

.summary-item:first-child {
  padding-left: 0;
}

.summary-item:last-child {
  border-right: 0;
}

.summary-item span {
  display: block;
  color: var(--muted);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  margin-bottom: 6px;
}

.summary-item strong {
  font-size: 16px;
  color: var(--text);
}

input[type="number"] {
  color-scheme: dark;
}

.breakdown {
  margin-top: 18px;
}

.breakdown-row {
  display: flex;
  justify-content: space-between;
  padding: 9px 0;
  color: var(--muted);
  font-size: 13px;
}

.breakdown-row strong {

@media (max-width: 760px) {

  }

  grid-template-columns: repeat(3, 1fr);

.part-card {

  min-height: 245px;
  padding: 20px;
  border: 1px solid var(--line);
  border-radius: 14px;

  flex-direction: column;
  transition:
    transform .18s ease,
    border-color .18s ease,
    background .18s ease;
}

.part-card:hover {
  transform: translateY(-2px);
  border-color: rgba(127,179,255,.25);
  background:

}

.part-top {

  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;

.part-icon {

  font-weight: 800;
  letter-spacing: .1em;

.part-category {

  font-size: 9px;
  font-weight: 800;
  letter-spacing: .13em;

.part-name {

  font-size: 17px;
  font-weight: 700;

.part-price {

.part-footer {

  padding-top: 18px;

.part-link,

  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .08em;
}

.part-link {
  color: #d9c391;
  background:
    linear-gradient(180deg, rgba(177,142,76,.10), rgba(177,142,76,.035)),

  border: 1px solid rgba(202,164,88,.30);
  box-shadow:
    inset 0 1px 0 rgba(255,225,165,.04),
    0 2px 7px rgba(0,0,0,.18);
  transition:
    color .18s ease,
    background .18s ease,
    border-color .18s ease,
    box-shadow .18s ease,
    transform .18s ease;
}

.part-link:hover {
  color: #ead7a6;
  background:
    linear-gradient(180deg, rgba(177,142,76,.17), rgba(177,142,76,.06)),

  border-color: rgba(202,164,88,.58);
  box-shadow:
    inset 0 1px 0 rgba(255,225,165,.07),
    0 3px 12px rgba(0,0,0,.22),
    0 0 12px rgba(177,142,76,.06);
  transform: translateY(-1px);
}

.part-link-disabled {
  color: #65707c;
  background: rgba(255,255,255,.025);
  border: 1px solid rgba(255,255,255,.06);
  cursor: default;
}

.empty-state {
  grid-column: 1 / -1;
  padding: 55px 25px;
  text-align: center;
  border: 1px dashed var(--line);
  border-radius: 14px;
  color: var(--muted);
  background: var(--panel);
}

.empty-state strong {
  display: block;
  margin-bottom: 8px;
  color: var(--text);
  font-size: 15px;
}

.parts-count {
  color: var(--muted);
  font-size: 11px;
}

@media (max-width: 900px) {
  .parts-grid {
    grid-template-columns: repeat(2, 1fr);

@media (max-width: 620px) {

    flex-direction: column;
  }

  .parts-head .field {
    width: 100%;
  }

  .parts-grid {
    grid-template-columns: 1fr;
  }
}

const modelSelect = document.getElementById("modelSelect");
const repairSelect = document.getElementById("repairSelect");
const videoArea = document.getElementById("videoArea");
const guidesArea = document.getElementById("guidesArea");

Object.keys(REPAIR_DATA).forEach(model => {
  const option = document.createElement("option");
  option.value = model;
  option.textContent = model;
  modelSelect.appendChild(option);
});

modelSelect.value = "iPhone 14 Pro Max";

function loadRepairs() {
  const repairs = REPAIR_DATA[modelSelect.value] || {};
  repairSelect.innerHTML = "";

  Object.keys(repairs).forEach(repair => {
    const option = document.createElement("option");
    option.value = repair;
    option.textContent = repair;
    repairSelect.appendChild(option);
  });

  renderRepair();
}

function renderRepair() {
  const repair =
    REPAIR_DATA[modelSelect.value]?.[repairSelect.value];

  if (!repair) {
    videoArea.innerHTML = `
      <div class="empty-state">
        <strong>No tutorial data yet</strong>
        Tutorials voor dit model zijn nog niet toegevoegd.
      </div>
    `;
    guidesArea.innerHTML = "";
    return;
  }

  const videos = repair.videos || [];
  const guides = repair.guides || [];

  if (videos.length) {
    videoArea.innerHTML = videos.map(video => `
      <div style="margin-bottom:16px;">
        <div style="
          aspect-ratio:16/9;
          overflow:hidden;
          border-radius:12px;
          border:1px solid var(--border);
          background:#000;
        ">
          <iframe
            src="https://www.youtube.com/embed/${video.youtube}?start=${video.start || 0}${video.end ? `&end=${video.end}` : ""}"
            title="${video.title}"
            style="width:100%;height:100%;border:0;"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
          </iframe>
        </div>

        <div style="
          margin-top:10px;
          font-size:13px;
          font-weight:700;
          color:var(--text);
        ">
          ${video.title}
        </div>

        ${video.relevant ? `
          <div style="
            margin-top:5px;
            color:#d9c391;
            font-size:9px;
            font-weight:800;
            letter-spacing:.10em;
          ">
            RELEVANT SECTION · ${video.relevant}
          </div>
        ` : ""}
      </div>
    `).join("");
  } else {
    videoArea.innerHTML = `
      <div class="empty-state">
        <strong>No video guide yet</strong>
        Video tutorial nog niet toegevoegd.
      </div>
    `;
  }

  if (guides.length) {
    guidesArea.innerHTML = guides.map(guide => `
      <div class="repair-row">
        <div>
          <strong>${guide.title}</strong>
          <div class="part-meta">
            ${guide.type} · Photos + detailed repair steps
          </div>
        </div>

        <a
          class="part-link"
          style="width:120px;"
          href="${guide.url}"
          target="_blank"
          rel="noopener">
          OPEN GUIDE ↗
        </a>
      </div>
    `).join("");
  } else {
    guidesArea.innerHTML = `
      <div class="part-meta" style="padding:12px 0;">
        Geen step-by-step guide toegevoegd.
      </div>
    `;
  }
}

modelSelect.addEventListener("change", loadRepairs);
repairSelect.addEventListener("change", renderRepair);

loadRepairs();
</script>


<script>
// EAGLE_PULL_REFRESH
(() => {
  if (!("ontouchstart" in window)) return;

  const mode = "wrap";

  const contentElements =
    mode === "chat"
      ? [
          document.querySelector(".topbar"),
          document.querySelector(".shell")
        ].filter(Boolean)
      : [document.querySelector(".wrap")].filter(Boolean);

  if (!contentElements.length) return;

  document.documentElement.style.overscrollBehaviorY = "none";
  document.body.style.overscrollBehaviorY = "none";

  const indicator = document.createElement("div");
  indicator.id = "eagle-pull-refresh";
  indicator.style.cssText = [
    "position:fixed",
    "top:10px",
    "left:50%",
    "transform:translate(-50%,-60px)",
    "z-index:100001",
    "padding:9px 14px",
    "border:1px solid rgba(255,255,255,.12)",
    "border-radius:999px",
    "background:rgba(12,17,23,.96)",
    "color:#c9aa6a",
    "font:700 10px -apple-system,BlinkMacSystemFont,sans-serif",
    "letter-spacing:1px",
    "opacity:0",
    "pointer-events:none",
    "transition:opacity .12s ease"
  ].join(";");

  indicator.textContent = "↓ PULL TO REFRESH";
  document.body.appendChild(indicator);

  let startX = 0;
  let startY = 0;
  let distance = 0;
  let pulling = false;
  let gestureLocked = false;
  const trigger = 220;
  const indicatorReveal = 85;

  function pageAtTop() {
    return window.scrollY <= 1 &&
      document.documentElement.scrollTop <= 1 &&
      document.body.scrollTop <= 1;
  }

  function nestedScrollerAboveTop(target) {
    let el = target instanceof Element ? target : null;

    while (el && el !== document.body) {
      const style = window.getComputedStyle(el);
      const scrollable =
        /(auto|scroll)/.test(style.overflowY) &&
        el.scrollHeight > el.clientHeight + 1;

      if (scrollable && el.scrollTop > 1) {
        return true;
      }

      el = el.parentElement;
    }

    return false;
  }

  function setContentTransform(value) {
    contentElements.forEach(el => {
      el.style.transform = value;
    });
  }

  function setContentTransition(value) {
    contentElements.forEach(el => {
      el.style.transition = value;
    });
  }

  function reset() {
    setContentTransition("transform .22s ease");
    setContentTransform("translateY(0px)");
    indicator.style.opacity = "0";
    indicator.style.transform = "translate(-50%,-60px)";

    setTimeout(() => {
      setContentTransition("");
    }, 230);
  }

  document.addEventListener("touchstart", event => {
    if (event.touches.length !== 1) return;
    if (!pageAtTop()) return;
    if (nestedScrollerAboveTop(event.target)) return;

    const touch = event.touches[0];
    const nav = document.querySelector(".eagle-nav");

    if (nav) {
      const rect = nav.getBoundingClientRect();
      if (
        touch.clientY >= rect.top - 35 &&
        touch.clientY <= rect.bottom + 35
      ) return;
    }

    startX = touch.clientX;
    startY = touch.clientY;
    distance = 0;
    pulling = true;
    gestureLocked = false;
    setContentTransition("none");
  }, { passive: true, capture: true });

  document.addEventListener("touchmove", event => {
    if (!pulling || event.touches.length !== 1) return;

    const deltaX = event.touches[0].clientX - startX;
    const rawDistance = event.touches[0].clientY - startY;

    if (!gestureLocked) {
      if (
        Math.abs(deltaX) > 12 &&
        Math.abs(deltaX) >= Math.abs(rawDistance) * 0.8
      ) {
        pulling = false;
        return;
      }

      if (rawDistance < 30) return;

      if (rawDistance < Math.abs(deltaX) * 1.35) {
        pulling = false;
        return;
      }

      gestureLocked = true;
    }

    if (rawDistance <= 0) {
      distance = 0;
      setContentTransform("translateY(0px)");
      return;
    }

    if (!pageAtTop()) {
      pulling = false;
      reset();
      return;
    }

    event.preventDefault();

    distance = rawDistance;

    const drag = Math.min(
      150,
      rawDistance * 0.78
    );

    setContentTransform(
      "translateY(" + drag + "px)"
    );

    if (distance >= indicatorReveal) {
      indicator.style.opacity = "1";
      indicator.style.transform = "translate(-50%,10px)";
      indicator.textContent =
        distance >= trigger
          ? "↻ RELEASE TO REFRESH"
          : "↓ PULL TO REFRESH";
    } else {
      indicator.style.opacity = "0";
      indicator.style.transform = "translate(-50%,-60px)";
    }
  }, { passive: false, capture: true });

  document.addEventListener("touchend", () => {
    if (!pulling) return;

    pulling = false;

    if (distance >= trigger) {
      indicator.textContent = "↻ REFRESHING";
      setContentTransition("transform .18s ease");
      setContentTransform("translateY(54px)");

      setTimeout(() => {
        const url = new URL(window.location.href);
        url.searchParams.set("refresh", Date.now().toString());
        window.location.replace(url.toString());
      }, 120);

      return;
    }

    reset();
  }, { capture: true });

  document.addEventListener("touchcancel", () => {
    pulling = false;
    reset();
  }, { capture: true });
})();
</script>


<script>
// EAGLE_NAV_FRESH
(() => {
  document.querySelectorAll(".eagle-nav a.nav-link").forEach(link => {
    link.addEventListener("click", event => {
      if (
        event.defaultPrevented ||
        event.button > 0 ||
        event.metaKey ||
        event.ctrlKey ||
        event.shiftKey ||
        event.altKey
      ) {
        return;
      }

      const href = link.getAttribute("href");
      if (!href || href.startsWith("#")) return;

      event.preventDefault();

      const url = new URL(href, window.location.href);
      url.searchParams.set("refresh", Date.now().toString());

      window.location.assign(url.toString());
    });
  });
})();
</script>



<script>
// EAGLE MOBILE NAVIGATION
(() => {
  const trigger = document.getElementById("eagle-mobile-menu-trigger");
  const menu = document.getElementById("eagle-mobile-menu");
  const overlay = document.getElementById("eagle-mobile-menu-overlay");
  const closeButton = document.getElementById("eagle-mobile-menu-close");

  if (!trigger || !menu || !overlay || !closeButton) return;

  function openMenu() {
    document.body.classList.add("eagle-mobile-menu-open");
    trigger.setAttribute("aria-expanded", "true");
    menu.setAttribute("aria-hidden", "false");
  }

  function closeMenu() {
    document.body.classList.remove("eagle-mobile-menu-open");
    trigger.setAttribute("aria-expanded", "false");
    menu.setAttribute("aria-hidden", "true");
  }

  trigger.addEventListener("click", openMenu);

  trigger.addEventListener("keydown", event => {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      openMenu();
    }
  });

  closeButton.addEventListener("click", closeMenu);
  overlay.addEventListener("click", closeMenu);

  let swipeStartX = 0;
  let swipeStartY = 0;
  let swipeTracking = false;
  let swipeLocked = false;

  menu.addEventListener("touchstart", event => {
    if (
      event.touches.length !== 1 ||
      !document.body.classList.contains("eagle-mobile-menu-open")
    ) return;

    const touch = event.touches[0];
    swipeStartX = touch.clientX;
    swipeStartY = touch.clientY;
    swipeTracking = true;
    swipeLocked = false;
  }, { passive: true });

  menu.addEventListener("touchmove", event => {
    if (!swipeTracking || event.touches.length !== 1) return;

    const deltaX = event.touches[0].clientX - swipeStartX;
    const deltaY = event.touches[0].clientY - swipeStartY;

    if (!swipeLocked) {
      if (Math.abs(deltaY) > 14 && Math.abs(deltaY) > Math.abs(deltaX)) {
        swipeTracking = false;
        return;
      }

      if (Math.abs(deltaX) < 14) return;

      if (Math.abs(deltaX) <= Math.abs(deltaY) * 1.2) {
        swipeTracking = false;
        return;
      }

      swipeLocked = true;
    }

    if (deltaX >= 0) return;

    event.preventDefault();

    const drag = Math.max(deltaX, -140);
    menu.style.transition = "none";
    menu.style.transform = "translate3d(" + drag + "px,0,0)";
  }, { passive: false });

  function finishSwipe(event) {
    if (!swipeTracking) return;

    const touch = event.changedTouches && event.changedTouches[0];
    const deltaX = touch ? touch.clientX - swipeStartX : 0;

    swipeTracking = false;
    menu.style.transition = "";
    menu.style.transform = "";

    if (swipeLocked && deltaX <= -70) {
      closeMenu();
    }

    swipeLocked = false;
  }

  menu.addEventListener("touchend", finishSwipe, { passive: true });
  menu.addEventListener("touchcancel", () => {
    swipeTracking = false;
    swipeLocked = false;
    menu.style.transition = "";
    menu.style.transform = "";
  }, { passive: true });

  document.addEventListener("keydown", event => {
    if (event.key === "Escape") closeMenu();
  });

  menu.querySelectorAll("a").forEach(link => {
    link.addEventListener("click", closeMenu);
  });
})();
</script>
