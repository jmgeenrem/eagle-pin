    adhesive: `
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7">
        <path d="M12 3 4 7l8 4 8-4-8-4Z"/>
        <path d="m4 12 8 4 8-4"/>
        <path d="m4 17 8 4 8-4"/>
      </svg>`
  };

  return icons[type] || icons.screen;
}

const modelSelect = document.getElementById("modelSelect");
const partsGrid = document.getElementById("partsGrid");
const partsCount = document.getElementById("partsCount");

Object.keys(PARTS_DATA).forEach(model => {
  const option = document.createElement("option");
  option.value = model;
  option.textContent = model;
  modelSelect.appendChild(option);
});

modelSelect.value = "iPhone 14 Pro Max";

function renderParts() {
  const model = modelSelect.value;
  const parts = PARTS_DATA[model] || [];

  partsCount.textContent =
    `${parts.length} SOURCE${parts.length === 1 ? "" : "S"}`;

  if (!parts.length) {
    partsGrid.innerHTML = `
      <div class="empty-state">
        <strong>No sourcing data yet</strong>
        Parts voor ${model} zijn nog niet toegevoegd.
      </div>
    `;
    return;
  }

  partsGrid.innerHTML = parts.map(part => `
    <article class="part-card">
      <div class="part-top">
        <div class="part-icon">${icon(part.icon)}</div>
        ${part.preferred ? '<span class="preferred">PREFERRED</span>' : ''}
      </div>

      <div class="part-category">${part.category}</div>
      <div class="part-name">${part.name}</div>
      <div class="part-price">${euro(part.price)}</div>

      <div class="part-meta">
        ${part.supplier}<br>
        ${part.shipping}
      </div>

      <div class="part-footer">
        ${part.url
          ? `<a class="part-link" href="${part.url}" target="_blank" rel="noopener">OPEN PART ↗</a>`
          : `<div class="part-link-disabled">LINK NOG TOEVOEGEN</div>`
        }
      </div>
    </article>
  `).join("");
}

modelSelect.addEventListener("change", renderParts);
renderParts();
</script>


<script>
// EAGLE_PULL_REFRESH
(() => {
  if (!("ontouchstart" in window)) return;

  const mode = "wrap";

  const contentElements =
    mode === "chat"
      ? [
          document.querySelector(".topbar"),
          document.querySelector(".shell")
        ].filter(Boolean)
      : [document.querySelector(".wrap")].filter(Boolean);

  if (!contentElements.length) return;

  document.documentElement.style.overscrollBehaviorY = "none";
  document.body.style.overscrollBehaviorY = "none";

  const indicator = document.createElement("div");
  indicator.id = "eagle-pull-refresh";
  indicator.style.cssText = [
    "position:fixed",
    "top:10px",
    "left:50%",
    "transform:translate(-50%,-60px)",
    "z-index:100001",
    "padding:9px 14px",
    "border:1px solid rgba(255,255,255,.12)",
    "border-radius:999px",
    "background:rgba(12,17,23,.96)",
    "color:#c9aa6a",
    "font:700 10px -apple-system,BlinkMacSystemFont,sans-serif",
    "letter-spacing:1px",
    "opacity:0",
    "pointer-events:none",
    "transition:opacity .12s ease"
  ].join(";");

  indicator.textContent = "↓ PULL TO REFRESH";
  document.body.appendChild(indicator);

  let startY = 0;
  let distance = 0;
  let pulling = false;
  const trigger = 130;

  function pageAtTop() {
    return window.scrollY <= 1 &&
      document.documentElement.scrollTop <= 1 &&
      document.body.scrollTop <= 1;
  }

  function nestedScrollerAboveTop(target) {
    let el = target instanceof Element ? target : null;

    while (el && el !== document.body) {
      const style = window.getComputedStyle(el);
      const scrollable =
        /(auto|scroll)/.test(style.overflowY) &&
        el.scrollHeight > el.clientHeight + 1;

      if (scrollable && el.scrollTop > 1) {
        return true;
      }

      el = el.parentElement;
    }

    return false;
  }

  function setContentTransform(value) {
    contentElements.forEach(el => {
      el.style.transform = value;
    });
  }

  function setContentTransition(value) {
    contentElements.forEach(el => {
      el.style.transition = value;
    });
  }

  function reset() {
    setContentTransition("transform .22s ease");
    setContentTransform("translateY(0px)");
    indicator.style.opacity = "0";
    indicator.style.transform = "translate(-50%,-60px)";

    setTimeout(() => {
      setContentTransition("");
    }, 230);
  }

  document.addEventListener("touchstart", event => {
    if (event.touches.length !== 1) return;
    if (!pageAtTop()) return;
    if (nestedScrollerAboveTop(event.target)) return;

    startY = event.touches[0].clientY;
    distance = 0;
    pulling = true;
    setContentTransition("none");
  }, { passive: true, capture: true });

  document.addEventListener("touchmove", event => {
    if (!pulling || event.touches.length !== 1) return;

    const rawDistance = event.touches[0].clientY - startY;

    if (rawDistance <= 0) {
      distance = 0;
      setContentTransform("translateY(0px)");
      return;
    }

    if (!pageAtTop()) {
      pulling = false;
      reset();
      return;
    }

    event.preventDefault();

    distance = rawDistance;

    const drag = Math.min(
      150,
      rawDistance * 0.78
    );

    setContentTransform(
      "translateY(" + drag + "px)"
    );

    indicator.style.opacity = "1";
    indicator.style.transform = "translate(-50%,10px)";
    indicator.textContent =
      distance >= trigger
        ? "↻ RELEASE TO REFRESH"
        : "↓ PULL TO REFRESH";
  }, { passive: false, capture: true });

  document.addEventListener("touchend", () => {
    if (!pulling) return;

    pulling = false;

    if (distance >= trigger) {
      indicator.textContent = "↻ REFRESHING";
      setContentTransition("transform .18s ease");
      setContentTransform("translateY(54px)");

      setTimeout(() => {
        const url = new URL(window.location.href);
        url.searchParams.set("refresh", Date.now().toString());
        window.location.replace(url.toString());
      }, 120);

      return;
    }

    reset();
  }, { capture: true });

  document.addEventListener("touchcancel", () => {
    pulling = false;
    reset();
  }, { capture: true });
})();
</script>


<script>
// EAGLE_NAV_FRESH
(() => {
  document.querySelectorAll(".eagle-nav a.nav-link").forEach(link => {
    link.addEventListener("click", event => {
      if (
        event.defaultPrevented ||
        event.button > 0 ||
        event.metaKey ||
        event.ctrlKey ||
        event.shiftKey ||
        event.altKey
      ) {
        return;
      }

      const href = link.getAttribute("href");
      if (!href || href.startsWith("#")) return;

      event.preventDefault();

      const url = new URL(href, window.location.href);
      url.searchParams.set("refresh", Date.now().toString());

      window.location.assign(url.toString());
    });
  });
})();
</script>
